name: 构建手动测试包

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: 仅验证 Windows 与 Linux 受控进程，不构建测试包
        required: true
        default: false
        type: boolean
      macos_arm64:
        description: 构建 macOS arm64
        required: true
        default: true
        type: boolean
      macos_x64:
        description: 构建 macOS x64
        required: true
        default: false
        type: boolean
      windows_x64:
        description: 构建 Windows x64
        required: true
        default: false
        type: boolean
      linux_x64:
        description: 构建 Linux x64
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-process-runner:
    name: 受控进程验证（${{ matrix.runner }}）
    if: inputs.validation_only == true
    runs-on: ${{ matrix.runner }}
    env:
      PROMOTABLE: "false"
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-22.04]
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.98.0

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 运行公共受控进程 fixture
        run: >-
          cargo test --locked
          --manifest-path src-tauri/Cargo.toml
          core::process_runner::tests

      - name: 检查当前平台全部 Rust 目标
        run: >-
          cargo check --locked
          --manifest-path src-tauri/Cargo.toml
          --all-targets

      - name: 记录不可晋级验证摘要
        shell: bash
        run: |
          {
            echo "purpose: process-fixture-validation"
            echo "promotable: false"
            echo "runner: $RUNNER_OS"
            echo "source_sha: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  select-targets:
    name: 选择测试目标
    if: inputs.validation_only == false
    runs-on: ubuntu-22.04
    outputs:
      targets_json: ${{ steps.matrix.outputs.targets_json }}
    steps:
      - name: 生成精确测试矩阵
        id: matrix
        shell: bash
        env:
          MACOS_ARM64: ${{ inputs.macos_arm64 }}
          MACOS_X64: ${{ inputs.macos_x64 }}
          WINDOWS_X64: ${{ inputs.windows_x64 }}
          LINUX_X64: ${{ inputs.linux_x64 }}
        run: |
          set -euo pipefail
          TARGETS='[]'
          if [ "$MACOS_ARM64" = "true" ]; then
            TARGETS="$(jq -c '. + [{"target_id":"macos-arm64","runner":"macos-latest","rust_target":"aarch64-apple-darwin","bundles":"app,dmg"}]' <<<"$TARGETS")"
          fi
          if [ "$MACOS_X64" = "true" ]; then
            TARGETS="$(jq -c '. + [{"target_id":"macos-x64","runner":"macos-latest","rust_target":"x86_64-apple-darwin","bundles":"app,dmg"}]' <<<"$TARGETS")"
          fi
          if [ "$WINDOWS_X64" = "true" ]; then
            TARGETS="$(jq -c '. + [{"target_id":"windows-x64","runner":"windows-latest","rust_target":"x86_64-pc-windows-msvc","bundles":"nsis,msi"}]' <<<"$TARGETS")"
          fi
          if [ "$LINUX_X64" = "true" ]; then
            TARGETS="$(jq -c '. + [{"target_id":"linux-x64","runner":"ubuntu-22.04","rust_target":"x86_64-unknown-linux-gnu","bundles":"appimage,deb,rpm"}]' <<<"$TARGETS")"
          fi
          if [ "$(jq 'length' <<<"$TARGETS")" = "0" ]; then
            echo "至少选择一个测试目标" >&2
            exit 1
          fi
          echo "targets_json=$TARGETS" >> "$GITHUB_OUTPUT"

  manual-package:
    name: 不可晋级手动测试包
    if: inputs.validation_only == false
    needs: select-targets
    permissions:
      contents: read
    uses: ./.github/workflows/test-package-build.yml
    with:
      source_sha: ${{ github.sha }}
      artifact_prefix: skill-expert-manual-test
      targets_json: ${{ needs.select-targets.outputs.targets_json }}
