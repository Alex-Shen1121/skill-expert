name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "正式发布只允许顺序递增补丁版本"
        required: true
        default: "patch"
        type: choice
        options:
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release target
        id: target
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          OUTPUT=$(npm run --silent release:prepare -- "$RELEASE_TYPE" --dry-run)
          printf '%s\n' "$OUTPUT"
          VERSION=$(printf '%s\n' "$OUTPUT" | sed -n 's/^\[dry-run\] [0-9][0-9.]*\(-[0-9][0-9]*\)\? -> \([0-9][0-9.]*\)$/\2/p')
          if [ -z "$VERSION" ]; then
            echo "Unable to resolve target version" >&2
            exit 1
          fi
          BRANCH="release-prep/v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing preparation branch or pull request
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Preparation branch ${BRANCH} already exists" >&2
            exit 1
          fi
          PR_COUNT=$(gh pr list --state all --head "$BRANCH" --json number --jq 'length')
          if [ "$PR_COUNT" -ne 0 ]; then
            echo "A pull request for ${BRANCH} already exists" >&2
            exit 1
          fi

      - name: Create preparation branch
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: git switch -c "$BRANCH"

      - name: Prepare and validate release files
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm run release:prepare -- "$RELEASE_TYPE"
          npm run version:check

      - name: Commit and push preparation branch
        env:
          VERSION: ${{ steps.target.outputs.version }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git add \
            CHANGELOG.md \
            CHANGELOG-zh.md \
            package.json \
            package-lock.json \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/tauri.conf.json \
            src/i18n/en.json \
            src/i18n/zh.json \
            src/i18n/zh-TW.json
          git diff --cached --check
          git commit -m "chore: prepare release v${VERSION}"
          git push --force-with-lease="refs/heads/${BRANCH}:" --set-upstream origin "$BRANCH"

      - name: Open release preparation pull request
        env:
          VERSION: ${{ steps.target.outputs.version }}
          BRANCH: ${{ steps.target.outputs.branch }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: prepare release v${VERSION}" \
            --body "Prepares Skill Expert v${VERSION}. Related issue: #8. Verification: npm run release:prepare -- ${RELEASE_TYPE}; npm run version:check. Merging updates main only; it does not create a tag or invoke the legacy release workflow."
