name: 正式发布 Skill Expert（旧路径）

on:
  push:
    branches:
      - release

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: 验证晋级并建立 Draft
    if: github.event_name == 'push' && github.ref == 'refs/heads/release' && vars.RELEASE_PIPELINE_MODE != 'candidate-reuse'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
      release_sha: ${{ steps.contract.outputs.release_sha }}
      candidate_sha: ${{ steps.contract.outputs.candidate_sha }}
      tag_exists: ${{ steps.contract.outputs.tag_exists }}
      draft_exists: ${{ steps.contract.outputs.draft_exists }}
    steps:
      - name: 检出精确 release HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: 生产发布必须使用已配置的 Updater 信任根
        run: npm run updater:check:production

      - name: 绑定合法 main 到 release 合并身份
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CURRENT_RELEASE_SHA="$(gh api "repos/${REPO}/git/ref/heads/release" --jq '.object.sha')"
          if [ "$CURRENT_RELEASE_SHA" != "$RELEASE_SHA" ]; then
            echo "当前 release HEAD 已变化：预期 ${RELEASE_SHA}，实际 ${CURRENT_RELEASE_SHA}" >&2
            exit 1
          fi

          PARENTS="$(git show -s --format=%P "$RELEASE_SHA")"
          PREVIOUS_RELEASE_SHA="$(awk '{print $1}' <<<"$PARENTS")"
          CANDIDATE_SHA="$(awk '{print $2}' <<<"$PARENTS")"
          if [ "$(wc -w <<<"$PARENTS" | tr -d ' ')" != "2" ]; then
            echo "release HEAD 必须是 main 到 release 的双父 merge commit" >&2
            exit 1
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/commits/${RELEASE_SHA}/pulls" > "$RUNNER_TEMP/release-pulls.json"
          VALID_PRS="$(jq \
            --arg repo "$REPO" \
            --arg release_sha "$RELEASE_SHA" \
            '[.[] | select(
              .merged_at != null and
              .head.ref == "main" and
              .base.ref == "release" and
              .head.repo.full_name == $repo and
              .merge_commit_sha == $release_sha
            )]' "$RUNNER_TEMP/release-pulls.json")"
          if [ "$(jq 'length' <<<"$VALID_PRS")" != "1" ]; then
            echo "release push 必须对应唯一且已合并的同仓库 main 到 release PR" >&2
            jq '.' "$RUNNER_TEMP/release-pulls.json" >&2
            exit 1
          fi

          RECOVERY_ARGUMENTS=()
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            RECOVERY_ARGUMENTS+=(--allow-existing-tag --recovery-run-id "$RUN_ID")
          fi
          env -u GH_TOKEN node scripts/release-merge.mjs verify \
            --release-sha "$RELEASE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --previous-release-sha "$PREVIOUS_RELEASE_SHA" \
            --json \
            "${RECOVERY_ARGUMENTS[@]}" > "$RUNNER_TEMP/release-contract.json"
          VERSION="$(jq -r '.version' "$RUNNER_TEMP/release-contract.json")"
          TAG="$(jq -r '.tag' "$RUNNER_TEMP/release-contract.json")"
          TAG_EXISTS="$(jq -r '.tagExists' "$RUNNER_TEMP/release-contract.json")"

          gh api "repos/${REPO}/releases?per_page=100" > "$RUNNER_TEMP/existing-releases.json"
          MATCHING_RELEASES="$(jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag)]' "$RUNNER_TEMP/existing-releases.json")"
          DRAFT_RELEASES="$(jq '[.[] | select(.draft == true)]' <<<"$MATCHING_RELEASES")"
          PUBLISHED_COUNT="$(jq '[.[] | select(.draft == false)] | length' <<<"$MATCHING_RELEASES")"
          DRAFT_COUNT="$(jq 'length' <<<"$DRAFT_RELEASES")"
          if [ "$PUBLISHED_COUNT" != "0" ] || [ "$DRAFT_COUNT" -gt 1 ]; then
            echo "tag ${TAG} 已绑定公开 Release 或多个 Draft，禁止恢复" >&2
            exit 1
          fi
          if [ "$TAG_EXISTS" = "false" ] && [ "$DRAFT_COUNT" != "0" ]; then
            echo "tag ${TAG} 尚不存在但已存在 Draft，发布状态不一致" >&2
            exit 1
          fi
          if [ "$DRAFT_COUNT" = "1" ]; then
            if [ "$TAG_EXISTS" != "true" ]; then
              echo "恢复用 Draft 必须绑定已经精确验证的 annotated tag" >&2
              exit 1
            fi
            DRAFT_EXISTS=true
          else
            DRAFT_EXISTS=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "release_sha=$RELEASE_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "tag_exists=$TAG_EXISTS"
            echo "draft_exists=$DRAFT_EXISTS"
          } >> "$GITHUB_OUTPUT"

      - name: 生成 Draft 说明
        shell: bash
        env:
          VERSION: ${{ steps.contract.outputs.version }}
          TAG: ${{ steps.contract.outputs.tag }}
          RELEASE_SHA: ${{ steps.contract.outputs.release_sha }}
          CANDIDATE_SHA: ${{ steps.contract.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          BODY_ZH="$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG-zh.md | awk -f scripts/strip-empty-sections.awk)"
          RELEASE_DATE="$(grep -m1 "^## \[${VERSION}\] - " CHANGELOG.md | sed -E "s/^## \[${VERSION}\] - ([0-9-]+).*/\1/")"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Skill Expert ${TAG}

          发布日期：\`${RELEASE_DATE}\`
          发布提交：\`${RELEASE_SHA}\`
          候选提交：\`${CANDIDATE_SHA}\`

          ${BODY_ZH}

          ## macOS 分发说明

          macOS 版本使用 ad-hoc 签名且不经过 Apple 公证。首次打开时可能需要前往「系统设置 → 隐私与安全性 → 仍要打开」；无需关闭 Gatekeeper。

          EOF

      - name: 创建不可变 annotated tag
        if: steps.contract.outputs.tag_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.contract.outputs.tag }}
          RELEASE_SHA: ${{ steps.contract.outputs.release_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG_OBJECT_SHA="$(gh api --method POST "repos/${REPO}/git/tags" \
            -f tag="$TAG" \
            -f message="Skill Expert $TAG"$'\n'"workflow-run-id: ${RUN_ID}" \
            -f object="$RELEASE_SHA" \
            -f type="commit" \
            -f 'tagger[name]=Skill Expert 发布机器人' \
            -f 'tagger[email]=skill-expert-release@users.noreply.github.com' \
            -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --jq '.sha')"
          gh api --method POST "repos/${REPO}/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$TAG_OBJECT_SHA"

      - name: 创建不可见 Draft Release
        if: steps.contract.outputs.draft_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.contract.outputs.tag }}
          RELEASE_SHA: ${{ steps.contract.outputs.release_sha }}
          VERSION: ${{ steps.contract.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$RELEASE_SHA" \
            --title "Skill Expert v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            --latest=false \
            --verify-tag

  build-release:
    name: 正式构建（${{ matrix.target_id }}）
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
          - target_id: macos-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            bundles: app,dmg
          - target_id: windows-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - target_id: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    steps:
      - name: 检出精确 release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 恢复 Rust 依赖缓存
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: 安装前端依赖
        run: npm ci

      - name: 再次验证生产 Updater 信任根
        run: npm run updater:check:production

      - name: 构建独立 CLI
        shell: bash
        run: >-
          cargo build --release --locked
          --manifest-path src-tauri/Cargo.toml
          --bin skill-expert-cli
          --target "${{ matrix.rust_target }}"

      - name: 使用生产 Updater 密钥构建完整桌面包
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUST_TARGET: ${{ matrix.rust_target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "release Environment 缺少生产 Updater 签名 Secret" >&2
            exit 1
          fi
          npm run tauri -- build --ci --target "$RUST_TARGET" --bundles "$BUNDLES"

      - name: 验证 macOS ad-hoc 可执行面
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_ROOT: src-tauri/target/${{ matrix.rust_target }}/release
        run: |
          set -euo pipefail
          BUNDLE_DIR="$BUILD_ROOT/bundle/macos"
          APP_PATH="$BUNDLE_DIR/Skill Expert.app"
          CLI_PATH="$BUILD_ROOT/skill-expert-cli"
          codesign --force --sign - "$CLI_PATH"
          ARCHIVE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "未生成 macOS Updater archive" >&2
            exit 1
          fi
          node scripts/verify-macos-adhoc.mjs \
            --app "$APP_PATH" \
            --archive "$ARCHIVE" \
            --cli "$CLI_PATH"

      - name: 整理稳定正式资产名
        shell: bash
        env:
          BUILD_ROOT: src-tauri/target/${{ matrix.rust_target }}/release
          TARGET_ID: ${{ matrix.target_id }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/candidate-assets.mjs stage \
            --version "$VERSION" \
            --target "$TARGET_ID" \
            --build-root "$BUILD_ROOT" \
            --directory "release-assets/$TARGET_ID"
          node scripts/candidate-assets.mjs verify \
            --version "$VERSION" \
            --target "$TARGET_ID" \
            --directory "release-assets/$TARGET_ID"

      - name: 用稳定文件名重新签署 Updater 资产
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET_ID: ${{ matrix.target_id }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: >-
          node scripts/sign-release-updater.mjs
          --version "$VERSION"
          --target "$TARGET_ID"
          --directory "release-assets/$TARGET_ID"

      - name: 上传到同一 Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            --repo "$REPO" \
            "release-assets/${{ matrix.target_id }}/"*

  release-metadata:
    name: 生成 Updater 元数据与校验和
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.prepare-release.outputs.version }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      release_sha: ${{ needs.prepare-release.outputs.release_sha }}
    steps:
      - name: 检出发布工具
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: 下载 Draft 中的真实平台资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 生成四平台 latest.json 与 SHA256SUMS
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_DATE="$(grep -m1 "^## \[${VERSION}\] - " CHANGELOG.md | sed -E "s/^## \[${VERSION}\] - ([0-9-]+).*/\1/")"
          node scripts/legacy-release-assets.mjs metadata \
            --version "$VERSION" \
            --directory release-assets \
            --pub-date "${RELEASE_DATE}T00:00:00Z"
          node scripts/legacy-release-assets.mjs checksums \
            --version "$VERSION" \
            --directory release-assets

      - name: 上传元数据与完整性清单
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            --repo "$REPO" \
            release-assets/latest.json \
            release-assets/SHA256SUMS

  release-provenance:
    name: 生成旧路径构建来源证明
    needs: release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ needs.release-metadata.outputs.version }}
      tag: ${{ needs.release-metadata.outputs.tag }}
      release_sha: ${{ needs.release-metadata.outputs.release_sha }}
    steps:
      - name: 检出发布工具
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release-metadata.outputs.release_sha }}

      - name: 下载 Draft 中待证明的真实资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 为 Draft 实际字节生成来源证明
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: 上传来源证明到同一 Draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" release-assets/build-provenance.json
          gh release upload "$TAG" \
            --repo "$REPO" \
            release-assets/build-provenance.json

  verify-release:
    name: 下载回验全部正式资产
    needs: release-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.release-provenance.outputs.tag }}
    steps:
      - name: 检出发布验证工具
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release-provenance.outputs.release_sha }}

      - name: 下载 Draft 的最终真实资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-provenance.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 验证精确清单、哈希与 Updater 密码学签名
        shell: bash
        env:
          VERSION: ${{ needs.release-provenance.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/legacy-release-assets.mjs verify \
            --version "$VERSION" \
            --directory release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
          node scripts/verify-updater-metadata.mjs \
            --file release-assets/latest.json \
            --version "$VERSION" \
            --asset-directory release-assets

      - name: 验证每个正式字节的旧路径构建来源证明
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-provenance.outputs.release_sha }}
        run: |
          set -euo pipefail
          cd release-assets
          {
            awk '{print $2}' SHA256SUMS
            echo SHA256SUMS
          } | while IFS= read -r ASSET_NAME; do
            gh attestation verify "$ASSET_NAME" \
              --repo "$REPO" \
              --bundle build-provenance.json \
              --source-digest "$RELEASE_SHA" \
              --source-ref refs/heads/release \
              --signer-workflow "$REPO/.github/workflows/release-legacy.yml"
          done

  verify-macos:
    name: 下载回验 macOS ad-hoc 签名
    needs: release-provenance
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-arm64
            runner: macos-latest
          - target_id: macos-x64
            runner: macos-15-intel
    steps:
      - name: 检出 macOS 回验工具
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release-provenance.outputs.release_sha }}

      - name: 下载 Draft 的最终真实资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-provenance.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 验证 DMG、Updater archive 与 CLI 的 ad-hoc 签名
        env:
          VERSION: ${{ needs.release-provenance.outputs.version }}
          TARGET_ID: ${{ matrix.target_id }}
        run: >-
          node scripts/verify-macos-release.mjs
          --version "$VERSION"
          --directory release-assets
          --target "$TARGET_ID"

  verify-native:
    name: 下载回验原生版本（${{ matrix.target_id }}）
    needs: release-provenance
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: linux-x64
            runner: ubuntu-22.04
          - target_id: windows-x64
            runner: windows-latest
    steps:
      - name: 检出原生版本回验工具
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release-provenance.outputs.release_sha }}

      - name: 下载 Draft 的最终真实资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-provenance.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 安装 Linux 包检查工具
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools binutils

      - name: 回验 Linux CLI 与三种桌面包版本
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.release-provenance.outputs.version }}
        run: >-
          node scripts/verify-linux-release.mjs
          --version "$VERSION"
          --directory release-assets

      - name: 回验 Windows CLI、NSIS 与 MSI 版本
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-provenance.outputs.version }}
        run: >-
          ./scripts/verify-windows-release.ps1
          -Version "$env:VERSION"
          -Directory release-assets

  publish-release:
    name: 原子公开 Latest
    needs: [verify-release, verify-macos, verify-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 仅公开已通过全部门禁的 Draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --repo "$REPO" \
            --draft=false \
            --latest
