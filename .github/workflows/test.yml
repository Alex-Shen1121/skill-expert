name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    name: Frontend and version contract

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 测试稳定版本契约
        run: npm run test:version

      - name: 验证 main PR 版本边界
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: >-
          node scripts/stable-version-policy.mjs verify-main-pr
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --head-ref "$HEAD_REF"

      - name: 检查稳定版本一致性
        run: npm run version:check

      - name: 测试前端行为
        run: npm run test:frontend

      - name: 检查代码规范
        run: npm run lint

      - name: 检查类型
        run: npm run typecheck

      - name: 构建生产前端
        run: npm run build

  workflow-lint:
    runs-on: ubuntu-22.04
    name: GitHub Actions syntax

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 actionlint
        run: GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: 验证工作流语法
        run: '"$RUNNER_TEMP/actionlint-bin/actionlint"'

      - name: 检查 Action 固定引用与 Node 24 运行时
        run: npm run test:workflows

  rust-quality:
    runs-on: ubuntu-22.04
    name: Rust quality and Linux check

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 运行 Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 检查 Linux 构建
        run: cargo check --manifest-path src-tauri/Cargo.toml
