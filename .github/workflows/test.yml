name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    name: Frontend and version contract

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test version contract
        run: npm run test:version

      - name: Test release preparation contract
        run: npm run test:release

      - name: Test candidate packaging contract
        run: npm run test:candidate

      - name: Test release promotion contract
        run: npm run test:promotion

      - name: Check version consistency
        run: npm run version:check

      - name: Check desktop identity
        run: npm run desktop:identity:check

      - name: Check CLI identity
        run: npm run cli:identity:check

      - name: Test repository identity contract
        run: npm run test:repository-identity

      - name: Test frontend behavior
        run: npm run test:frontend

      - name: Check repository identity
        run: npm run repository:identity:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

  workflow-lint:
    runs-on: ubuntu-22.04
    name: GitHub Actions syntax

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install actionlint
        run: GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate workflows
        run: '"$RUNNER_TEMP/actionlint-bin/actionlint"'

  rust-quality:
    runs-on: ubuntu-22.04
    name: Rust quality and Linux check

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check Linux build
        run: cargo check --manifest-path src-tauri/Cargo.toml

  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS covers the unix code paths; Windows covers the
          # cfg(windows) paths (symlink/junction sync, removal).
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: Rust tests (${{ matrix.label }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      # cargo test needs no frontend build: tauri's generate_context only
      # reads the config, and beforeBuildCommand applies to `tauri build`.
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # vctip.exe (VC++ telemetry) lingers after cl.exe and locks files in
      # target/, which intermittently breaks the post-job cache save and
      # marks a green run red (see the save-if note in release.yml). Kill
      # it before the cache save runs so this job can keep saving caches.
      - name: Kill VC telemetry before cache save
        if: runner.os == 'Windows'
        continue-on-error: true
        run: taskkill /f /im vctip.exe

  release-promotion-shape:
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-22.04
    name: Release promotion source

    steps:
      - name: Reject a non-main or cross-repository promotion
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "main" ] || \
             [ "$BASE_REF" != "release" ] || \
             [ "$HEAD_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "Release promotion must use this repository's main branch as head and release as base" >&2
            exit 1
          fi

  candidate-guard:
    needs: [frontend, workflow-lint, rust-quality, rust-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    name: Release candidate guard

    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fetch promotion refs
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/release:refs/remotes/origin/release

      - name: Verify exact release candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: >-
          node scripts/release-candidate.mjs verify
          --candidate-sha "$CANDIDATE_SHA"
          --head main
          --base release

  candidate-package:
    needs: candidate-guard
    name: Four-target release candidate
    uses: ./.github/workflows/candidate-build.yml
    with:
      candidate_sha: ${{ github.sha }}

  candidate-pr:
    needs: candidate-package
    runs-on: ubuntu-22.04
    name: Create or refresh release promotion
    permissions:
      contents: read
      pull-requests: write

    steps:
      # GitHub jobs have isolated filesystems. Repeat the exact checkout and
      # fetch here so a main push during packaging invalidates the old candidate.
      - name: Checkout packaged candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Refresh promotion refs
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/release:refs/remotes/origin/release

      - name: Create or update the exact release promotion
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROMOTION_BODY="$RUNNER_TEMP/release-promotion.md"
          node scripts/release-candidate.mjs render-pr-body \
            --candidate-sha "$CANDIDATE_SHA" \
            --head main \
            --base release \
            --output "$PROMOTION_BODY"

          PROMOTION_PRS="$(gh pr list --state open --base release --limit 1000 \
            --json number,headRefName,baseRefName,isCrossRepository,headRefOid)"
          VALID_PROMOTIONS="$(jq --arg candidate_sha "$CANDIDATE_SHA" \
            '[.[] | select(.headRefName == "main" and .baseRefName == "release" and (.isCrossRepository | not) and .headRefOid == $candidate_sha)]' \
            <<<"$PROMOTION_PRS")"

          PR_COUNT="$(jq 'length' <<<"$VALID_PROMOTIONS")"
          if [ "$PR_COUNT" -gt 1 ]; then
            echo "Expected at most one open release promotion pull request, found $PR_COUNT" >&2
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          TITLE="Release promotion: Skill Expert v${VERSION}"
          if [ "$PR_COUNT" -eq 1 ]; then
            PR_NUMBER="$(jq -r '.[0].number' <<<"$VALID_PROMOTIONS")"
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "$PROMOTION_BODY"
          else
            gh pr create \
              --base release \
              --head main \
              --title "$TITLE" \
              --body-file "$PROMOTION_BODY"
          fi
