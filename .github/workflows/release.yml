name: 正式发布 Agent 技能管家

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 已合入 main 的精确 40 位发布提交 SHA
        required: true
        type: string

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: 验证 main 发布提交并建立 Draft
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      checks: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
      release_sha: ${{ steps.contract.outputs.release_sha }}
    steps:
      - name: 检出精确 main 发布提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: 生产发布必须使用已配置的 Updater 信任根
        run: npm run updater:check:production

      - name: 验证精确 main 稳定版本身份
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha 必须是完整的小写 40 位提交 SHA" >&2
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$INPUT_RELEASE_SHA" ]; then
            echo "发布检出不一致：预期 ${INPUT_RELEASE_SHA}，实际 ${ACTUAL_SHA}" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$INPUT_RELEASE_SHA" origin/main; then
            echo "release_sha 必须是已经合入 main 的提交" >&2
            exit 1
          fi
          npm run version:check
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "正式发布版本必须是稳定版本 x.y.z，实际为 ${VERSION}" >&2
            exit 1
          fi
          RELEASE_REF="codex/release-v${VERSION}"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/commits/${INPUT_RELEASE_SHA}/pulls" > "$RUNNER_TEMP/release-pulls.json"
          VALID_RELEASES="$(jq \
            --arg repo "$REPO" \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$INPUT_RELEASE_SHA" \
            '[.[] | select(
              .merged_at != null and
              .head.ref == $release_ref and
              .base.ref == "main" and
              .head.repo.full_name == $repo and
              .merge_commit_sha == $release_sha
            )]' "$RUNNER_TEMP/release-pulls.json")"
          if [ "$(jq 'length' <<<"$VALID_RELEASES")" != "1" ]; then
            echo "release_sha 必须对应唯一且已合并的 ${RELEASE_REF} → main PR" >&2
            exit 1
          fi

          gh api -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/commits/${INPUT_RELEASE_SHA}/check-runs?per_page=100" \
            > "$RUNNER_TEMP/release-checks.json"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/actions/workflows/test.yml/runs?event=push&branch=main&head_sha=${INPUT_RELEASE_SHA}&status=completed&per_page=100" \
            > "$RUNNER_TEMP/release-test-runs.json"
          SUCCESSFUL_PUSH_RUNS="$(jq --arg release_sha "$INPUT_RELEASE_SHA" \
            '[.workflow_runs[] | select(
              .event == "push" and
              .head_branch == "main" and
              .head_sha == $release_sha and
              .conclusion == "success"
            )] | length' "$RUNNER_TEMP/release-test-runs.json")"
          if [ "$SUCCESSFUL_PUSH_RUNS" -lt 1 ]; then
            echo "发布提交缺少成功的 main push Test workflow run" >&2
            exit 1
          fi
          for REQUIRED_CHECK in \
            "Frontend and version contract" \
            "GitHub Actions syntax" \
            "Rust quality and Linux check"; do
            SUCCESS_COUNT="$(jq --arg name "$REQUIRED_CHECK" \
              '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length' \
              "$RUNNER_TEMP/release-checks.json")"
            if [ "$SUCCESS_COUNT" -lt 1 ]; then
              echo "发布提交缺少成功检查：${REQUIRED_CHECK}" >&2
              exit 1
            fi
          done
          TAG="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "不可变标签 ${TAG} 已存在；请准备下一个补丁版本" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} 已存在；请准备下一个补丁版本" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "release_sha=$INPUT_RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: 生成 Draft 说明
        shell: bash
        env:
          VERSION: ${{ steps.contract.outputs.version }}
          TAG: ${{ steps.contract.outputs.tag }}
          RELEASE_SHA: ${{ steps.contract.outputs.release_sha }}
        run: |
          set -euo pipefail
          BODY_ZH="$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG-zh.md | awk -f scripts/strip-empty-sections.awk)"
          RELEASE_DATE="$(grep -m1 "^## \[${VERSION}\] - " CHANGELOG.md | sed -E "s/^## \[${VERSION}\] - ([0-9-]+).*/\1/")"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Agent 技能管家 ${TAG}

          发布日期：\`${RELEASE_DATE}\`
          发布提交：\`${RELEASE_SHA}\`

          ${BODY_ZH}

          ## macOS 分发说明

          macOS 版本使用 ad-hoc 签名且不经过 Apple 公证。首次打开时可能需要前往「系统设置 → 隐私与安全性 → 仍要打开」；无需关闭 Gatekeeper。

          EOF

      - name: 创建不可变 annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.contract.outputs.tag }}
          RELEASE_SHA: ${{ steps.contract.outputs.release_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG_OBJECT_SHA="$(gh api --method POST "repos/${REPO}/git/tags" \
            -f tag="$TAG" \
            -f message="Agent 技能管家 $TAG"$'\n'"workflow-run-id: ${RUN_ID}" \
            -f object="$RELEASE_SHA" \
            -f type="commit" \
            -f 'tagger[name]=Agent 技能管家发布机器人' \
            -f 'tagger[email]=skill-expert-release@users.noreply.github.com' \
            -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --jq '.sha')"
          gh api --method POST "repos/${REPO}/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$TAG_OBJECT_SHA"

      - name: 创建不可见 Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.contract.outputs.tag }}
          RELEASE_SHA: ${{ steps.contract.outputs.release_sha }}
          VERSION: ${{ steps.contract.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$RELEASE_SHA" \
            --title "Agent 技能管家 v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            --latest=false \
            --verify-tag

  build-release:
    name: 正式构建（${{ matrix.target_id }}）
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
          - target_id: macos-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            bundles: app,dmg
          - target_id: windows-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - target_id: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    steps:
      - name: 检出精确 main 发布提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust_target }}

      - name: 恢复 Rust 依赖缓存
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: 安装前端依赖
        run: npm ci

      - name: 再次验证生产 Updater 信任根
        run: npm run updater:check:production

      - name: 运行跨平台 Rust 测试
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建独立 CLI
        shell: bash
        run: >-
          cargo build --release --locked
          --manifest-path src-tauri/Cargo.toml
          --bin skill-expert-cli
          --target "${{ matrix.rust_target }}"

      - name: 使用生产 Updater 密钥构建完整桌面包
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUST_TARGET: ${{ matrix.rust_target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "release Environment 缺少生产 Updater 签名 Secret" >&2
            exit 1
          fi
          npm run tauri -- build --ci --target "$RUST_TARGET" --bundles "$BUNDLES"

      - name: 验证 macOS ad-hoc 可执行面
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_ROOT: src-tauri/target/${{ matrix.rust_target }}/release
        run: |
          set -euo pipefail
          BUNDLE_DIR="$BUILD_ROOT/bundle/macos"
          APP_PATH="$BUNDLE_DIR/Agent 技能管家.app"
          CLI_PATH="$BUILD_ROOT/skill-expert-cli"
          codesign --force --sign - "$CLI_PATH"
          ARCHIVE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "未生成 macOS Updater archive" >&2
            exit 1
          fi
          node scripts/verify-macos-adhoc.mjs \
            --app "$APP_PATH" \
            --archive "$ARCHIVE" \
            --cli "$CLI_PATH"

      - name: 整理稳定正式资产名
        shell: bash
        env:
          BUILD_ROOT: src-tauri/target/${{ matrix.rust_target }}/release
          TARGET_ID: ${{ matrix.target_id }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/package-assets.mjs stage \
            --version "$VERSION" \
            --target "$TARGET_ID" \
            --build-root "$BUILD_ROOT" \
            --directory "release-assets/$TARGET_ID"
          node scripts/package-assets.mjs verify \
            --version "$VERSION" \
            --target "$TARGET_ID" \
            --directory "release-assets/$TARGET_ID"

      - name: 用稳定文件名重新签署 Updater 资产
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET_ID: ${{ matrix.target_id }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: >-
          node scripts/sign-release-updater.mjs
          --version "$VERSION"
          --target "$TARGET_ID"
          --directory "release-assets/$TARGET_ID"

      - name: 上传到同一 Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TARGET_ID: ${{ matrix.target_id }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/package-assets.mjs draft-upload \
            --version "$VERSION" \
            --target "$TARGET_ID" |
            while IFS= read -r ASSET_NAME; do
              [ -n "$ASSET_NAME" ] || continue
              gh release upload "$TAG" \
                --repo "$REPO" \
                "release-assets/${TARGET_ID}/${ASSET_NAME}"
            done

  release-metadata:
    name: 生成 Updater 元数据与校验和
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.prepare-release.outputs.version }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      release_sha: ${{ needs.prepare-release.outputs.release_sha }}
    steps:
      - name: 检出发布工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: 下载 Draft 中的真实平台资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 生成四平台 latest.json 与 SHA256SUMS
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_DATE="$(grep -m1 "^## \[${VERSION}\] - " CHANGELOG.md | sed -E "s/^## \[${VERSION}\] - ([0-9-]+).*/\1/")"
          node scripts/release-assets.mjs metadata \
            --version "$VERSION" \
            --directory release-assets \
            --pub-date "${RELEASE_DATE}T00:00:00Z"
          node scripts/release-assets.mjs checksums \
            --version "$VERSION" \
            --directory release-assets

      - name: 上传元数据与完整性清单
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            --repo "$REPO" \
            release-assets/latest.json \
            release-assets/SHA256SUMS

      - name: 清理 Draft 临时资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-assets.mjs draft-only --version "$VERSION" |
            while IFS= read -r ASSET_NAME; do
              [ -n "$ASSET_NAME" ] || continue
              gh release delete-asset "$TAG" "$ASSET_NAME" \
                --repo "$REPO" \
                --yes
            done

  release-provenance:
    name: 生成正式构建来源证明
    needs: release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ needs.release-metadata.outputs.version }}
      tag: ${{ needs.release-metadata.outputs.tag }}
      release_sha: ${{ needs.release-metadata.outputs.release_sha }}
    steps:
      - name: 检出发布工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-metadata.outputs.release_sha }}

      - name: 下载 Draft 中待证明的真实资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 为 Draft 实际字节生成来源证明
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: 上传来源证明到同一 Draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" release-assets/build-provenance.json
          gh release upload "$TAG" \
            --repo "$REPO" \
            release-assets/build-provenance.json

  verify-release:
    name: 下载回验全部正式资产
    needs: release-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.release-provenance.outputs.tag }}
    steps:
      - name: 检出发布验证工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-provenance.outputs.release_sha }}

      - name: 下载 Draft 的最终真实资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-provenance.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 验证精确清单、哈希与 Updater 密码学签名
        shell: bash
        env:
          VERSION: ${{ needs.release-provenance.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-assets.mjs verify \
            --version "$VERSION" \
            --directory release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
          node scripts/verify-updater-metadata.mjs \
            --file release-assets/latest.json \
            --version "$VERSION" \
            --asset-directory release-assets

      - name: 验证每个正式字节的构建来源证明
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-provenance.outputs.release_sha }}
        run: |
          set -euo pipefail
          cd release-assets
          {
            awk '{print $2}' SHA256SUMS
            echo SHA256SUMS
          } | while IFS= read -r ASSET_NAME; do
            gh attestation verify "$ASSET_NAME" \
              --repo "$REPO" \
              --bundle build-provenance.json \
              --source-digest "$RELEASE_SHA" \
              --source-ref refs/heads/main \
              --signer-workflow "$REPO/.github/workflows/release.yml"
          done

  verify-macos:
    name: 下载回验 macOS ad-hoc 签名
    needs: release-provenance
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-arm64
            runner: macos-latest
          - target_id: macos-x64
            runner: macos-15-intel
    steps:
      - name: 检出 macOS 回验工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-provenance.outputs.release_sha }}

      - name: 下载 Draft 的最终真实资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-provenance.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 验证 DMG 与 Updater archive 的 ad-hoc 签名
        env:
          VERSION: ${{ needs.release-provenance.outputs.version }}
          TARGET_ID: ${{ matrix.target_id }}
        run: >-
          node scripts/verify-macos-release.mjs
          --version "$VERSION"
          --directory release-assets
          --target "$TARGET_ID"

  verify-native:
    name: 下载回验原生版本（${{ matrix.target_id }}）
    needs: release-provenance
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: linux-x64
            runner: ubuntu-22.04
          - target_id: windows-x64
            runner: windows-latest
    steps:
      - name: 检出原生版本回验工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-provenance.outputs.release_sha }}

      - name: 下载 Draft 的最终真实资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-provenance.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/download-draft-release-assets.sh release-assets

      - name: 安装 Linux 包检查工具
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools binutils

      - name: 回验 Linux 三种桌面包版本
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.release-provenance.outputs.version }}
        run: >-
          node scripts/verify-linux-release.mjs
          --version "$VERSION"
          --directory release-assets

      - name: 回验 Windows NSIS 与 MSI 版本
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-provenance.outputs.version }}
        run: >-
          ./scripts/verify-windows-release.ps1
          -Version "$env:VERSION"
          -Directory release-assets

  publish-release:
    name: 原子公开 Latest
    needs: [verify-release, verify-macos, verify-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 仅公开已通过全部门禁的 Draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --repo "$REPO" \
            --draft=false \
            --latest
