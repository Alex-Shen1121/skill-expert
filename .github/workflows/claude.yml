name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # 允许 Claude 读取 PR 的 CI 结果
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 运行 Claude Code
        id: claude
        uses: anthropics/claude-code-action@70fec183852c4f82f3f1969faed7dd60c5149ca7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # 可选：允许 Claude 读取 PR 的 CI 结果
          additional_permissions: |
            actions: read

          # 可选：提供自定义提示词；省略时执行 @claude 评论中的指令
          # prompt: '更新 PR 描述并包含变更摘要。'

          # 可选：通过 claude_args 自定义行为与配置
          # 参考 https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # 或 https://code.claude.com/docs/en/cli-reference
          # claude_args: '--allowed-tools Bash(gh pr *)'
