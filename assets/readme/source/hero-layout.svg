<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Agent 技能管家</title>
  <desc id="desc">一个中央技能库把技能按需分配给 Claude Code、Codex、Cursor 和 Gemini CLI。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C0F"/>
      <stop offset="0.55" stop-color="#10101A"/>
      <stop offset="1" stop-color="#151029"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="skill-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1C25"/>
      <stop offset="1" stop-color="#171720"/>
    </linearGradient>
    <radialGradient id="subject-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="subject-clip">
      <rect x="420" y="52" width="304" height="346" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <path d="M0 314 C214 267 349 400 572 350 C792 301 951 188 1200 236 V420 H0 Z"
        fill="#8B5CF6" fill-opacity="0.045"/>
  <circle cx="575" cy="220" r="190" fill="url(#subject-glow)"/>

  <g id="title-block" transform="translate(58 48)">
    <g aria-label="Desktop skill control plane">
      <rect width="310" height="34" rx="17" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.42"/>
      <circle cx="18" cy="17" r="5" fill="#34D399"/>
      <text x="33" y="22" fill="#A7F3D0" font-size="15" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.1">DESKTOP SKILL CONTROL PLANE</text>
    </g>

    <text x="0" y="106" fill="#FAFAFA" font-size="63" font-weight="760"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          letter-spacing="-2.2">Agent</text>
    <text x="0" y="170" fill="#FAFAFA" font-size="63" font-weight="760"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          letter-spacing="-2.2">技能管家</text>

    <text x="2" y="210" fill="#C4B5FD" font-size="18" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2.8">SKILL EXPERT</text>

    <text x="0" y="257" fill="#D4D4D8" font-size="23" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">一个技能库，连接每一个 Agent。</text>
    <text x="0" y="288" fill="#8E8E96" font-size="18"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">组织 · 部署 · 更新 · 备份</text>

    <g transform="translate(0 322)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">
      <rect width="104" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="16" y="21" fill="#D4D4D8">52 AGENTS</text>
      <rect x="114" width="108" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="130" y="21" fill="#D4D4D8">3 DESKTOPS</text>
      <rect x="232" width="94" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="248" y="21" fill="#D4D4D8">1 LIBRARY</text>
    </g>
  </g>

  <g id="imagegen-subject" clip-path="url(#subject-clip)">
    <image href="./hero-subject.png" x="420" y="52" width="304" height="346"
           preserveAspectRatio="xMidYMid slice"/>
    <rect x="420" y="52" width="304" height="346" fill="none"
          stroke="#A78BFA" stroke-opacity="0.24"/>
  </g>

  <g id="project-proof" transform="translate(712 42)">
    <rect width="432" height="336" rx="22" fill="#131317" stroke="#2A2A34"/>
    <rect x="18" y="18" width="396" height="42" rx="12" fill="#19191F" stroke="#2A2A34"/>
    <circle cx="40" cy="39" r="7" fill="#10B981"/>
    <text x="58" y="45" fill="#F4F4F5" font-size="18" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CENTRAL LIBRARY</text>
    <text x="390" y="45" text-anchor="end" fill="#71717A" font-size="15"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SYNCED</text>

    <g transform="translate(18 78)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <g>
        <rect width="190" height="58" rx="13" fill="url(#skill-surface)" stroke="#30303A"/>
        <rect x="13" y="13" width="32" height="32" rx="9" fill="#10B981" fill-opacity="0.14"/>
        <path d="M22 29h14M29 22v14" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>
        <text x="56" y="35" fill="#F4F4F5" font-size="19" font-weight="650">research-kit</text>
      </g>
      <g transform="translate(0 68)">
        <rect width="190" height="58" rx="13" fill="url(#skill-surface)" stroke="#30303A"/>
        <rect x="13" y="13" width="32" height="32" rx="9" fill="#22D3EE" fill-opacity="0.13"/>
        <path d="M22 24l-5 5 5 5M36 24l5 5-5 5M32 20l-6 18" stroke="#67E8F9" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="35" fill="#F4F4F5" font-size="19" font-weight="650">ship-web</text>
      </g>
      <g transform="translate(0 136)">
        <rect width="190" height="58" rx="13" fill="url(#skill-surface)" stroke="#30303A"/>
        <rect x="13" y="13" width="32" height="32" rx="9" fill="#8B5CF6" fill-opacity="0.14"/>
        <path d="M21 29l5 5 10-12" fill="none" stroke="#C4B5FD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="35" fill="#F4F4F5" font-size="19" font-weight="650">review-code</text>
      </g>
    </g>

    <g transform="translate(224 78)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <path d="M-16 29H0M-16 97H0M-16 165H0" stroke="url(#accent-line)" stroke-width="3" stroke-linecap="round"/>
      <path d="M-26 29v136" stroke="#3F3F46" stroke-width="1.5"/>

      <g>
        <rect width="190" height="44" rx="12" fill="#10B981" fill-opacity="0.075" stroke="#10B981" stroke-opacity="0.30"/>
        <circle cx="23" cy="22" r="9" fill="#10B981" fill-opacity="0.24"/>
        <circle cx="23" cy="22" r="4" fill="#34D399"/>
        <text x="42" y="28" fill="#E4E4E7" font-size="18" font-weight="650">Claude Code</text>
      </g>
      <g transform="translate(0 52)">
        <rect width="190" height="44" rx="12" fill="#22D3EE" fill-opacity="0.065" stroke="#22D3EE" stroke-opacity="0.28"/>
        <circle cx="23" cy="22" r="9" fill="#22D3EE" fill-opacity="0.22"/>
        <circle cx="23" cy="22" r="4" fill="#67E8F9"/>
        <text x="42" y="28" fill="#E4E4E7" font-size="18" font-weight="650">Codex</text>
      </g>
      <g transform="translate(0 104)">
        <rect width="190" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.075" stroke="#8B5CF6" stroke-opacity="0.30"/>
        <circle cx="23" cy="22" r="9" fill="#8B5CF6" fill-opacity="0.22"/>
        <circle cx="23" cy="22" r="4" fill="#C4B5FD"/>
        <text x="42" y="28" fill="#E4E4E7" font-size="18" font-weight="650">Cursor</text>
      </g>
      <g transform="translate(0 156)">
        <rect width="190" height="44" rx="12" fill="#F2A69B" fill-opacity="0.065" stroke="#F2A69B" stroke-opacity="0.26"/>
        <circle cx="23" cy="22" r="9" fill="#F2A69B" fill-opacity="0.20"/>
        <circle cx="23" cy="22" r="4" fill="#F6C8C0"/>
        <text x="42" y="28" fill="#E4E4E7" font-size="18" font-weight="650">Gemini CLI</text>
      </g>
    </g>

    <g transform="translate(18 292)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="396" height="26" rx="8" fill="#FFFFFF" fill-opacity="0.035"/>
      <text x="12" y="18" fill="#8E8E96" font-size="14">LIBRARY → PRESET → WORKSPACE → AGENT</text>
      <circle cx="376" cy="13" r="4" fill="#34D399"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="42" y="394" width="1116" height="2" rx="1" fill="url(#accent-line)" fill-opacity="0.52"/>
</svg>
